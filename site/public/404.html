<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Surau Bateh Lori — Kota Padang</title>
    <script type="text/javascript">
      // GitHub Pages tidak punya rewrite server-side, jadi refresh atau
      // deep-link langsung ke path bersih (mis. /jadwal-shalat) jatuh ke 404
      // bawaan Pages. Trik ini (spa-github-pages, lihat
      // https://github.com/rafgraph/spa-github-pages) meng-encode path asli
      // jadi query string lalu redirect ke `index.html`, yang membacanya
      // kembali lewat skrip di `index.html` dan memulihkan URL asli via
      // history.replaceState -- tanpa ini path bersih di App.jsx tidak akan
      // bertahan saat refresh di production.
      var segmentCount = 0; // domain kustom (suraubateh.web.id) disajikan di
      // root -- `base: '/'` di vite.config.js, bukan subpath GitHub Pages
      // bawaan (mis. `/nama-repo`), jadi tidak ada segmen path yang perlu
      // "dilewati" sebelum path bersihnya sendiri.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
