<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon-48x48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surau Bateh Lori — Kota Padang</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // Membalikkan trik redirect di `public/404.html` (spa-github-pages):
      // memulihkan path bersih asli dari query string `?/` sebelum React
      // mount, supaya App.jsx membaca `window.location.pathname` yang benar.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
