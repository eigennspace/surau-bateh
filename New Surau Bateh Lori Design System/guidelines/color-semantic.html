<!-- @dsCard group="Colors" viewport="700x160" name="Warna status" subtitle="Teal = berlangsung, emas = berikutnya, maroon = perhatian" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--sand-100);font-family:var(--font-sans);color:var(--text-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;letter-spacing:.02em}.sw span{opacity:.85;font-size:9px;font-variant-numeric:tabular-nums}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{border-radius:var(--radius-md);padding:12px;border:1px solid var(--border-default)}.t{font:var(--text-label);margin-bottom:6px}.m{font-size:11px;color:var(--text-muted)}</style>
<div class="g">
<div class="c" style="background:var(--status-active-soft);border-color:var(--teal-200)"><div class="t" style="color:var(--status-active)">Berlangsung</div><div class="m">--status-active</div></div>
<div class="c" style="background:var(--status-next-soft);border-color:var(--gold-200)"><div class="t" style="color:var(--gold-800)">Berikutnya</div><div class="m">--status-next</div></div>
<div class="c" style="background:var(--status-danger-soft);border-color:var(--maroon-100)"><div class="t" style="color:var(--status-danger)">Perhatian</div><div class="m">--status-danger</div></div>
<div class="c" style="background:var(--status-info-soft)"><div class="t" style="color:var(--status-info)">Netral</div><div class="m">--status-info</div></div>
</div>
