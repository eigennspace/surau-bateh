<!-- @dsCard group="Brand" viewport="700x200" name="Permukaan" subtitle="Pasir untuk halaman, putih untuk kartu, slate untuk kaki dan blok Isya" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--sand-100);font-family:var(--font-sans);color:var(--text-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;letter-spacing:.02em}.sw span{opacity:.85;font-size:9px;font-variant-numeric:tabular-nums}.s{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.s div{height:120px;border-radius:var(--radius-lg);padding:14px;font-size:12px}</style>
<div class="s">
<div style="background:var(--sand-200);border:1px solid var(--border-hairline);color:var(--text-body)">Latar halaman<br><span style="font-size:10px;color:var(--text-faint)">--surface-page</span></div>
<div style="background:var(--white);border:1px solid var(--border-default);box-shadow:var(--shadow-sm);color:var(--text-body)">Kartu<br><span style="font-size:10px;color:var(--text-faint)">--surface-card</span></div>
<div style="background:var(--surface-dark);color:var(--text-on-dark)">Blok gelap<br><span style="font-size:10px;color:var(--slate-400)">--surface-dark</span></div>
</div>
