<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, RadioGroup, Switch } = window.SurauBatehLoriDesignSystem_c76578;
const App = () => {

      <div className="col">
        <RadioGroup label="Nominal infak" value={nominal} onChange={setNominal} options={['Rp 50.000','Rp 100.000','Nominal lain']} />
        <Checkbox label="Kirim pengingat jadwal salat" description="Melalui grup WhatsApp jamaah." defaultChecked />
        <Switch label="Pengingat adzan" defaultChecked />

    </div>
