<!-- @startingPoint section="Situs Surau" subtitle="Situs surau lengkap: beranda, jadwal, agenda, infak" viewport="1180x820" -->
<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Surau Bateh Lori — Kota Padang</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>body{margin:0;background:var(--sand-200);font-family:var(--font-sans);color:var(--text-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="./Hero.jsx"></script>
<script type="text/babel" src="./Sections.jsx"></script>
<script type="text/babel" src="./SchedulePage.jsx"></script>
<script type="text/babel" src="./DonatePage.jsx"></script>
<script type="text/babel">
const NSK = window.SurauBatehLoriDesignSystem_c76578;
const { NavBar, Footer, Icon, Button } = NSK;
// Fail-soft: bila bundel belum memuat komponen ponsel, kit menyediakan versinya sendiri.
const NAV = ['Beranda','Profil','Jadwal Salat','Kajian','Infak','Kontak'];
const BB_ITEMS = [
  { label: 'Beranda', icon: 'house' },
  { label: 'Jadwal Salat', icon: 'clock', short: 'Jadwal' },
  { label: 'Kajian', icon: 'calendar-days' },
  { label: 'Infak', icon: 'hand-coins' },
  { label: 'Kontak', icon: 'phone' },
];
const BottomBar = NSK.BottomBar || function BottomBarFallback({ active, onNavigate }) {
  return (
    <nav style={{ position: 'fixed', inset: 'auto 0 0 0', zIndex: 40, display: 'grid', gridTemplateColumns: 'repeat(5,1fr)',
      background: 'rgba(253,251,246,.94)', backdropFilter: 'var(--blur-glass)', borderTop: '1px solid var(--border-hairline)' }}>
      {BB_ITEMS.map(it => {
        const on = it.label === active;
        return (
          <button key={it.label} type="button" onClick={() => onNavigate(it.label)}
            style={{ minHeight: 56, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 3,
              border: 'none', background: 'transparent', cursor: 'pointer', color: on ? 'var(--maroon-700)' : 'var(--text-muted)' }}>
            <Icon name={it.icon} size={20} />
            <span style={{ fontSize: 'var(--fs-overline)', fontWeight: on ? 'var(--fw-bold)' : 'var(--fw-medium)' }}>{it.short || it.label}</span>
          </button>
        );
      })}
    </nav>
  );
};
function MobileHeader({ active, onNavigate, onAction }) {
  const [open, setOpen] = React.useState(false);
  const go = it => { setOpen(false); onNavigate(it); };
  return (
    <header style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-4)', padding: '12px var(--space-5)', flexWrap: 'wrap',
      background: 'rgba(253,251,246,.88)', backdropFilter: 'var(--blur-glass)', borderBottom: '1px solid var(--border-hairline)',
      position: 'sticky', top: 0, zIndex: 30 }}>
      <img src="../../assets/logo-mark.png" alt="" style={{ height: 32 }} />
      <div style={{ display: 'flex', flexDirection: 'column', lineHeight: 1.1 }}>
        <span style={{ fontWeight: 'var(--fw-extrabold)', fontSize: 'var(--fs-body)', color: 'var(--maroon-700)' }}>Surau Bateh Lori</span>
        <span style={{ fontSize: 'var(--fs-overline)', letterSpacing: 'var(--ls-overline)', textTransform: 'uppercase', color: 'var(--text-faint)' }}>Kota Padang</span>
      </div>
      <button type="button" aria-label={open ? 'Tutup menu' : 'Buka menu'} aria-expanded={open} onClick={() => setOpen(o => !o)}
        style={{ marginLeft: 'auto', width: 44, height: 44, display: 'grid', placeItems: 'center', cursor: 'pointer',
          background: 'var(--white)', border: '1px solid var(--border-default)', borderRadius: 'var(--radius-pill)', color: 'var(--maroon-700)' }}>
        <Icon name={open ? 'x' : 'menu'} size={20} />
      </button>
      {open ? (
        <nav style={{ flexBasis: '100%', display: 'flex', flexDirection: 'column', gap: 2, paddingTop: 'var(--space-4)' }}>
          {NAV.map(it => (
            <a key={it} href="#" onClick={e => { e.preventDefault(); go(it); }}
              style={{ textDecoration: 'none', font: 'var(--text-label)', fontSize: 'var(--fs-body-lg)', minHeight: 48,
                display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 var(--space-4)',
                borderRadius: 'var(--radius-md)', color: it === active ? 'var(--maroon-700)' : 'var(--text-body)',
                background: it === active ? 'var(--surface-brand-soft)' : 'transparent' }}>
              {it}<Icon name="chevron-right" size={16} style={{ color: 'var(--text-faint)' }} />
            </a>
          ))}
          <Button tone="primary" size="lg" fullWidth icon="hand-coins" style={{ marginTop: 'var(--space-3)' }}
            onClick={() => { setOpen(false); onAction(); }}>Salurkan Infak</Button>
        </nav>
      ) : null}
    </header>
  );
}
const bundleHasMobileNav = !!NSK.BottomBar;
function App() {
  const [page, setPage] = React.useState('Beranda');
  const mobile = window.useKitBreakpoint();
  return (
    <div style={{ paddingBottom: mobile ? 64 : 0 }}>
      {(mobile && !bundleHasMobileNav)
        ? <MobileHeader active={page} onNavigate={setPage} onAction={() => setPage('Infak')} />
        : <NavBar logoSrc="../../assets/logo-mark.png" active={page} onNavigate={setPage} onAction={() => setPage('Infak')}
            items={NAV} style={{ position: 'sticky', top: 0, zIndex: 30 }} />}
      {page === 'Beranda' ? <>
        <Hero onNavigate={setPage} />
        <ProgramsSection />
        <GallerySection />
        <VerseSection />
        <AgendaSection />
        <StatsSection />
      </> : null}
      {page === 'Jadwal Salat' ? <SchedulePage /> : null}
      {page === 'Kajian' ? <AgendaSection /> : null}
      {page === 'Infak' ? <DonatePage /> : null}
      {page === 'Profil' ? <ProfilePage /> : null}
      {page === 'Kontak' ? <ContactPage /> : null}
      <Footer logoSrc="../../assets/logo-mark.png" columns={mobile ? [
        { title: 'Tautan', links: ['Jadwal Salat', 'Kajian Rutin', 'Infak & Sedekah', 'Profil', 'Kontak'] },
      ] : [
        { title: 'Layanan', links: ['Jadwal Salat', 'Kajian Rutin', 'Silat Tradisi', 'Santunan'] },
        { title: 'Surau', links: ['Profil', 'Pengurus', 'Laporan Kas', 'Kontak'] },
        { title: 'Jamaah', links: ['Daftar Kajian', 'Infak & Sedekah', 'Pengumuman'] },
      ]} />
      <BottomBar active={page} onNavigate={setPage} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
