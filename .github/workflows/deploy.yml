name: Deploy situs produksi ke GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # Dipicu webhook Sanity saat dokumen `article`/`galleryItem` di-publish di
  # Studio (lihat ADR 0006, .scratch/cms-migration-sanity/issues/03-scaffold-build-time-fetch-webhook.md)
  # -- webhook memanggil GitHub API `POST /repos/{owner}/{repo}/dispatches`
  # dengan `event_type: sanity-publish`. Menjalankan job yang sama persis
  # (test -> build -> deploy), tidak ada jalur pintas yang melewati test.
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Run tests
        working-directory: site
        run: npm test
      - name: Build
        working-directory: site
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
